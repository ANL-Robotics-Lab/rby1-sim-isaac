<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 34px "Noto Sans CJK KR", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 16px "Noto Sans CJK KR", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", Arial, sans-serif; fill: #475569; }
      .label { font: 700 18px "Noto Sans CJK KR", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", Arial, sans-serif; fill: #0f172a; }
      .text { font: 500 15px "Noto Sans CJK KR", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", Arial, sans-serif; fill: #334155; }
      .small { font: 500 13px "Noto Sans CJK KR", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", Arial, sans-serif; fill: #475569; }
      .mono { font: 600 14px "DejaVu Sans Mono", "Consolas", monospace; fill: #1e293b; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 8; }
      .box-blue { fill: #eff6ff; stroke: #93c5fd; stroke-width: 1.5; rx: 8; }
      .box-green { fill: #ecfdf5; stroke: #86efac; stroke-width: 1.5; rx: 8; }
      .box-amber { fill: #fffbeb; stroke: #fcd34d; stroke-width: 1.5; rx: 8; }
      .box-gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1.5; rx: 8; }
      .stage { fill: #ffffff; stroke: #64748b; stroke-width: 2; rx: 8; }
      .stage-dash { fill: none; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 8 6; rx: 8; }
      .arrow { fill: none; stroke: #334155; stroke-width: 2; marker-end: url(#arrow); }
      .arrow-blue { fill: none; stroke: #2563eb; stroke-width: 2.5; marker-end: url(#arrow-blue); }
      .arrow-dash { fill: none; stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 7 5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" width="1280" height="900"/>

  <text class="title" x="48" y="58">RB-Y1 시뮬레이터 사용자 그리퍼 부착 구조</text>
  <text class="subtitle" x="48" y="88">기본은 그리퍼 없는 로봇 USD를 로드하고, 옵션이 켜진 경우에만 사용자 그리퍼 USD를 reference 후 fixed joint로 부착합니다.</text>

  <rect class="box-blue" x="48" y="125" width="275" height="100"/>
  <text class="label" x="70" y="158">기본 실행</text>
  <text class="mono" x="70" y="186">--no-gripper</text>
  <text class="small" x="70" y="210">그리퍼 없는 RB-Y1 USD 로드</text>

  <rect class="box-amber" x="382" y="125" width="350" height="100"/>
  <text class="label" x="404" y="158">그리퍼 옵션</text>
  <text class="mono" x="404" y="186">--gripper --gripper-name &lt;name&gt;</text>
  <text class="small" x="404" y="210">assets/gripper/&lt;name&gt;/ 규칙으로 사용자 asset 선택</text>

  <rect class="box" x="790" y="125" width="420" height="100"/>
  <text class="label" x="812" y="158">Gripper asset resolver</text>
  <text class="mono" x="812" y="184">gripper.json</text>
  <text class="mono" x="812" y="207">&lt;name&gt;_left.usd / &lt;name&gt;_right.usd</text>

  <path class="arrow" d="M323 175 L382 175"/>
  <path class="arrow" d="M732 175 L790 175"/>

  <rect class="stage" x="48" y="285" width="770" height="470"/>
  <text class="label" x="70" y="320">USD Stage</text>
  <text class="mono" x="70" y="348">/World/RBY1</text>

  <rect class="box-gray" x="88" y="385" width="270" height="270"/>
  <text class="label" x="112" y="420">Robot base USD</text>
  <text class="small" x="112" y="448">그리퍼 없는 RB-Y1 본체</text>
  <rect class="box" x="120" y="485" width="205" height="55"/>
  <text class="mono" x="138" y="519">link_left_arm_6</text>
  <rect class="box" x="120" y="570" width="205" height="55"/>
  <text class="mono" x="134" y="604">link_right_arm_6</text>

  <rect class="stage-dash" x="420" y="345" width="330" height="165"/>
  <text class="label" x="445" y="380">Left gripper reference</text>
  <text class="mono" x="445" y="408">/World/RBY1/left_gripper</text>
  <rect class="box-green" x="458" y="440" width="250" height="45"/>
  <text class="mono" x="478" y="468">mount body from json</text>

  <rect class="stage-dash" x="420" y="560" width="330" height="165"/>
  <text class="label" x="445" y="595">Right gripper reference</text>
  <text class="mono" x="445" y="623">/World/RBY1/right_gripper</text>
  <rect class="box-green" x="458" y="655" width="250" height="45"/>
  <text class="mono" x="478" y="683">mount body from json</text>

  <path class="arrow-blue" d="M325 512 L458 462"/>
  <text class="small" x="338" y="438">fixed joint</text>
  <text class="mono" x="338" y="458">tool_left</text>

  <path class="arrow-blue" d="M325 598 L458 678"/>
  <text class="small" x="338" y="690">fixed joint</text>
  <text class="mono" x="338" y="710">tool_right</text>

  <path class="arrow-dash" d="M553 225 L553 285"/>
  <path class="arrow-dash" d="M1000 225 C1000 255 725 255 665 345"/>

  <rect class="box" x="870" y="285" width="340" height="470"/>
  <text class="label" x="895" y="320">제어 책임 분리</text>

  <rect class="box-blue" x="905" y="360" width="270" height="80"/>
  <text class="label" x="925" y="392">RBY1Task</text>
  <text class="small" x="925" y="420">gripper joint target 적용만 담당</text>

  <path class="arrow" d="M1040 440 L1040 482"/>

  <rect class="box" x="905" y="482" width="270" height="80"/>
  <text class="label" x="925" y="514">BaseGripperServer</text>
  <text class="small" x="925" y="542">joint 이름, target, state publish 인터페이스</text>

  <path class="arrow" d="M990 562 L960 608"/>
  <path class="arrow" d="M1090 562 L1120 608"/>

  <rect class="box-green" x="875" y="608" width="155" height="86"/>
  <text class="label" x="895" y="640">RbGripper</text>
  <text class="small" x="895" y="666">UDP + Dynamixel</text>
  <text class="small" x="895" y="686">closeness 변환</text>

  <rect class="box-amber" x="1050" y="608" width="155" height="86"/>
  <text class="label" x="1070" y="640">Custom</text>
  <text class="small" x="1070" y="666">사용자 손 예시</text>
  <text class="small" x="1070" y="686">프로토콜 직접 구현</text>

  <rect class="box-gray" x="48" y="805" width="1162" height="56"/>
  <text class="label" x="70" y="838">새 그리퍼 추가 규칙</text>
  <text class="mono" x="245" y="838">assets/gripper/&lt;name&gt;/gripper.json</text>
  <text class="mono" x="610" y="838">&lt;name&gt;_left.usd</text>
  <text class="mono" x="800" y="838">&lt;name&gt;_right.usd</text>
  <text class="small" x="990" y="838">필요 시 custom_gripper server 구현</text>
</svg>
